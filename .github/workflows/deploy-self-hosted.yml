name: Deploy to Self-Hosted Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - production-cn
          - production-global
          - staging
          - development
        default: 'production-global'
        required: true

jobs:
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'supabase/functions/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUPABASE_SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SUPABASE_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy functions via SCP
        run: |
          echo "Deploying functions to ${{ secrets.SUPABASE_SERVER_USER }}@${{ secrets.SUPABASE_SERVER_HOST }}:${{ secrets.SUPABASE_PROJECT_PATH }}/volumes/functions/"
          
          # Copy each function directory
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            echo "Deploying function: $func_name"
            scp -r "$func_dir" "${{ secrets.SUPABASE_SERVER_USER }}@${{ secrets.SUPABASE_SERVER_HOST }}:${{ secrets.SUPABASE_PROJECT_PATH }}/volumes/functions/"
          done

      - name: Restart functions service
        run: |
          ssh ${{ secrets.SUPABASE_SERVER_USER }}@${{ secrets.SUPABASE_SERVER_HOST }} "
            cd ${{ secrets.SUPABASE_PROJECT_PATH }} && \
            sh run.sh restart functions
          "

  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-functions]
    if: always()
    steps:
      - name: Print deployment status
        run: |
          echo "Deployment completed!"
          echo "Functions deployment: ${{ needs.deploy-functions.result }}"
          
          if [[ "${{ needs.deploy-functions.result }}" == "failure" ]]; then
            echo "⚠️ Functions deployment failed. Check the logs above."
            exit 1
          else
            echo "✅ Functions deployment successful!"
          fi